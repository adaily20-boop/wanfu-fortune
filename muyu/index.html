<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>犬萬福・木魚</title>
<style>
  :root {
    --bg: #FFF8F2;
    --red: #FD1417;
    --black: #1A1A1A;
    --ink: #1A1A1A;
    --gold: #F2C94C;
    --gold-dk: #C48A18;
    --paper: #FFFDF8;
    --serif: "Songti TC", "STSong", "Hiragino Mincho ProN", "Kaiti TC", "KaiTi",
             "Noto Serif CJK TC", "Source Han Serif TC", "Songti SC", serif;
    --sans: "PingFang TC", "Hiragino Sans", "Noto Sans CJK TC", "Heiti TC",
            "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--black);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #fit {
    position: fixed;
    inset: 0;
    background: var(--bg);
  }
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 390px;
    height: 844px;
    margin: 0;
    background: var(--bg);
    transform-origin: center center;
    overflow: hidden;
  }
  .layout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px 24px;
  }
  .inu {
    display: block;
    height: 78px;
    width: auto;
    flex: 0 0 auto;
  }
  .fish-hit {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    margin: 10px 0 0;
    width: 300px;
    height: 318px;
    cursor: pointer;
    position: relative;
    flex: 0 0 auto;
  }
  .fish-hit:focus { outline: none; }
  .fish-hit:focus-visible {
    outline: 2px solid var(--gold-dk);
    outline-offset: 4px;
    border-radius: 16px;
  }
  .fish-hit svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .halo {
    position: absolute;
    left: 50%;
    top: 62%;
    width: 240px;
    height: 90px;
    margin-left: -120px;
    margin-top: -18px;
    background: radial-gradient(ellipse at center, rgba(242,201,76,.26) 0%, rgba(242,201,76,0) 72%);
    pointer-events: none;
    z-index: 0;
  }
  .fish-svg { position: relative; z-index: 1; }
  .mallet {
    transform-box: fill-box;
    transform-origin: 70% 92%;
    transform: rotate(-8deg);
  }
  .fish-body {
    transform-box: fill-box;
    transform-origin: 50% 55%;
  }
  .fish-hit.is-idle .fish-body {
    animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .fish-hit.is-striking .mallet {
    animation: strike .4s cubic-bezier(.2,.7,.2,1);
  }
  .fish-hit.is-striking .fish-body {
    animation: fishHit .4s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes strike {
    0%   { transform: rotate(-8deg); }
    32%  { transform: rotate(28deg); }
    100% { transform: rotate(-8deg); }
  }
  @keyframes fishHit {
    0%, 100% { transform: scale(1) rotate(0deg); }
    32%      { transform: scale(0.97, 1.02) rotate(-1.4deg); }
  }
  .slot {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    margin-top: 2px;
  }
  .hint {
    font-family: var(--serif);
    font-size: 16px;
    letter-spacing: 0.42em;
    color: #6B3E0A;
    text-indent: 0.42em;
    transition: opacity .4s ease;
    text-align: center;
    pointer-events: none;
    height: 28px;
    line-height: 28px;
    flex: 0 0 28px;
  }
  .hint.is-hide { opacity: 0; }
  .verse {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 36px;
    min-height: 196px;
    padding-top: 6px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.26;
    color: var(--ink);
  }
  .col .ch {
    display: block;
    height: 1.26em;
    opacity: 0;
  }
  .col .ch.is-on {
    animation: charIn .55s ease both;
  }
  .col .ch.is-shown {
    opacity: 1;
  }
  @keyframes charIn {
    from { opacity: 0; filter: blur(3px); }
    to   { opacity: 1; filter: blur(0); }
  }
  .logo-wanfu {
    width: 84px;
    height: auto;
    display: block;
    flex: 0 0 auto;
    margin-top: 8px;
  }
  .back {
    flex: 0 0 auto;
    margin-top: 14px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--black);
    text-decoration: none;
    border-bottom: 1.5px solid var(--gold-dk);
    padding-bottom: 2px;
  }
  .back:active { color: var(--red); }
  img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none;}
  body{-webkit-touch-callout:none;}
</style>
</head>

<script>
(function () {
  var SENTENCE = "忍人所不能忍，行人所不能行";
  var COL_R = "忍人所不能忍";
  var COL_L = "行人所不能行";

  var PRE_QING = 0;
  var PRE_KNOCK = 0.14;
  var SPEECH_AT = 720;
  var POST_PAUSE = 380;
  var POST_GAP = 300;
  var POST_GAINS = [0.95, 0.62, 0.34];
  var MALE_RE = /male|man|男|Yunxi|Yunyang|Yunjian|Kangkang|Kefu|Zhiwei|Changhong|Yunhao|Yunfeng|Yunze|Yunqi|Yunye|Yunchen|Yunxia|Guangxi|Chaoxiong|Brian|HanHan|Huihui/i;

  var stage = document.getElementById("stage");
  var fishHit = document.getElementById("fishHit");
  var hint = document.getElementById("hint");
  var colR = document.getElementById("colR");
  var colL = document.getElementById("colL");
  var busy = false;
  var audioCtx = null;
  var voicesCache = [];
  var safetyTimer = 0;
  var finished = false;

  function fit() {
    var w = window.innerWidth || 390;
    var h = window.innerHeight || 844;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    var s = Math.min(w / 390, h / 844);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

  function hasSpeech() {
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  }

  function refreshVoices() {
    if (!hasSpeech()) return;
    try { voicesCache = window.speechSynthesis.getVoices() || []; }
    catch (e) { voicesCache = []; }
  }
  if (hasSpeech()) {
    refreshVoices();
    if (typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
      window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
    }
  }

  function isZh(v) {
    var s = ((v.lang || "") + " " + (v.name || ""));
    return /zh(-|_|$)|chinese|中文|國語|国语|普通话|普通話|粵|粤|mandarin|cantonese/i.test(s);
  }
  function pickVoice() {
    refreshVoices();
    var voices = voicesCache || [];
    if (!voices.length) return null;
    var zh = voices.filter(isZh);
    var tw = zh.filter(function (v) { return /zh-TW|zh_TW|台灣|台湾|Taiwan|Meijia|Mei-Jia|美嘉|曉臻|晓臻/i.test((v.lang || "") + " " + (v.name || "")); });
    var cn = zh.filter(function (v) { return /zh-CN|zh_CN|中国|中國|China/i.test((v.lang || "") + " " + (v.name || "")); });
    var hk = zh.filter(function (v) { return /zh-HK|zh_HK|香港|Hong Kong/i.test((v.lang || "") + " " + (v.name || "")); });
    function maleFirst(list) {
      if (!list || !list.length) return null;
      var m = list.filter(function (v) { return MALE_RE.test(v.name || ""); });
      return m[0] || null;
    }
    return maleFirst(tw) || maleFirst(cn) || maleFirst(hk) || maleFirst(zh) ||
           tw[0] || cn[0] || hk[0] || zh[0] || voices[0] || null;
  }

  function lcg(seed) {
    var s = seed >>> 0;
    return function () {
      s = (Math.imul(1664525, s) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function makeNoise(ctx, dur, seed) {
    var n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var data = buf.getChannelData(0);
    var rnd = lcg(seed || 0xC0FFEE);
    var i;
    for (i = 0; i < n; i++) data[i] = rnd() * 2 - 1;
    return buf;
  }

  function playKnock(ctx, when, gain) {
    gain = (gain == null) ? 1 : gain;
    var dur = 0.36;
    var noise = ctx.createBufferSource();
    noise.buffer = makeNoise(ctx, 0.11, 0x51F151);
    var bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(640, when);
    bp.Q.setValueAtTime(5.2, when);
    var hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.setValueAtTime(220, when);
    var lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(2400, when);
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, when);
    ng.gain.linearRampToValueAtTime(0.72 * gain, when + 0.0018);
    ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    noise.connect(bp);
    bp.connect(hp);
    hp.connect(lp);
    lp.connect(ng);
    ng.connect(ctx.destination);
    noise.start(when);
    noise.stop(when + 0.11);

    var partials = [
      { f: 428, g: 0.26, d: 0.30 },
      { f: 548, g: 0.40, d: 0.34 },
      { f: 582, g: 0.18, d: 0.28 },
      { f: 706, g: 0.20, d: 0.22 },
      { f: 864, g: 0.10, d: 0.16 },
      { f: 210, g: 0.08, d: 0.18 }
    ];
    var i, p, osc, g;
    for (i = 0; i < partials.length; i++) {
      p = partials[i];
      osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(p.f, when);
      osc.frequency.exponentialRampToValueAtTime(Math.max(80, p.f * 0.97), when + p.d);
      g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(p.g * gain, when + 0.0035);
      g.gain.exponentialRampToValueAtTime(0.0001, when + p.d);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(when);
      osc.stop(when + p.d + 0.02);
    }
    return dur;
  }

  function playQing(ctx, when, gain) {
    gain = (gain == null) ? 0.32 : gain;
    var noise = ctx.createBufferSource();
    noise.buffer = makeNoise(ctx, 0.06, 0xBE1111);
    var bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(1860, when);
    bp.Q.setValueAtTime(8, when);
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, when);
    ng.gain.linearRampToValueAtTime(0.22 * gain, when + 0.002);
    ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.08);
    noise.connect(bp);
    bp.connect(ng);
    ng.connect(ctx.destination);
    noise.start(when);
    noise.stop(when + 0.06);

    var partials = [
      { f: 1480, g: 0.20, d: 1.15 },
      { f: 2210, g: 0.11, d: 0.90 },
      { f: 3120, g: 0.055, d: 0.62 },
      { f: 986, g: 0.07, d: 1.00 },
      { f: 1768, g: 0.06, d: 0.80 }
    ];
    var i, p, osc, g;
    for (i = 0; i < partials.length; i++) {
      p = partials[i];
      osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(p.f, when);
      g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(p.g * gain, when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + p.d);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(when);
      osc.stop(when + p.d + 0.02);
    }
  }

  function ensureCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (e) {}
    }
    return audioCtx;
  }

  function strikeVisual() {
    fishHit.classList.remove("is-idle");
    fishHit.classList.remove("is-striking");
    void fishHit.offsetWidth;
    fishHit.classList.add("is-striking");
  }

  function clearVerse() {
    colR.innerHTML = "";
    colL.innerHTML = "";
  }

  function fillCol(el, text) {
    el.innerHTML = "";
    var i, s;
    for (i = 0; i < text.length; i++) {
      s = document.createElement("span");
      s.className = "ch";
      s.textContent = text.charAt(i);
      el.appendChild(s);
    }
  }

  function revealVerse(totalMs) {
    fillCol(colR, COL_R);
    fillCol(colL, COL_L);
    var nodes = colR.querySelectorAll(".ch");
    var nodesL = colL.querySelectorAll(".ch");
    var all = [];
    var i;
    for (i = 0; i < nodes.length; i++) all.push(nodes[i]);
    for (i = 0; i < nodesL.length; i++) all.push(nodesL[i]);
    var step = all.length ? Math.max(80, (totalMs * 0.82) / all.length) : 200;
    for (i = 0; i < all.length; i++) {
      (function (node, delay) {
        setTimeout(function () { node.classList.add("is-on"); }, delay);
      })(all[i], Math.round(i * step));
    }
  }

  function showVerseNow() {
    fillCol(colR, COL_R);
    fillCol(colL, COL_L);
    var nodes = document.querySelectorAll(".col .ch");
    var i;
    for (i = 0; i < nodes.length; i++) nodes[i].classList.add("is-shown");
  }

  function unlockSpeech() {
    if (!hasSpeech()) return;
    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      u.rate = 1;
      u.pitch = 1;
      u.lang = "zh-TW";
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function estimateSpeechMs() {
    return Math.ceil(SENTENCE.length * 420 / RATE) + 400;
  }

  function speakSentence(onEnd) {
    if (!hasSpeech()) {
      onEnd();
      return;
    }
    try { window.speechSynthesis.cancel(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(SENTENCE);
    u.rate = RATE;
    u.pitch = PITCH;
    u.volume = 1;
    var v = pickVoice();
    if (v) {
      u.voice = v;
      u.lang = v.lang || "zh-TW";
    } else {
      u.lang = "zh-TW";
    }
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      onEnd();
    }
    u.onend = finish;
    u.onerror = finish;
    try { window.speechSynthesis.speak(u); }
    catch (err) { finish(); return; }
    /* some engines stay in speaking=false if voice isn't ready; retry once */
    setTimeout(function () {
      if (done) return;
      try {
        if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
          var v2 = pickVoice();
          if (v2) { u.voice = v2; u.lang = v2.lang || u.lang; }
          window.speechSynthesis.speak(u);
        }
      } catch (e2) {}
    }, 180);
  }

  function playIntro(ctx) {
    var t0 = ctx.currentTime + 0.02;
    playQing(ctx, t0 + PRE_QING, 0.34);
    playKnock(ctx, t0 + PRE_KNOCK, 1);
    setTimeout(strikeVisual, Math.round(PRE_KNOCK * 1000));
  }

  function playOutro(ctx, then) {
    var i, delay;
    for (i = 0; i < POST_GAINS.length; i++) {
      delay = i * POST_GAP;
      (function (d, g) {
        setTimeout(function () {
          if (ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
          playKnock(ctx, ctx.currentTime + 0.02, g);
          strikeVisual();
        }, d);
      })(delay, POST_GAINS[i]);
    }
    setTimeout(then, POST_GAINS.length * POST_GAP + 420);
  }

  function endRitual() {
    if (finished) return;
    finished = true;
    if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = 0; }
    var ctx = ensureCtx();
    function wrap() {
      hint.textContent = "輕敲木魚";
      hint.classList.remove("is-hide");
      fishHit.classList.remove("is-striking");
      fishHit.classList.add("is-idle");
      busy = false;
    }
    if (ctx) playOutro(ctx, wrap);
    else wrap();
  }

  function startRitual() {
    if (busy) return;
    busy = true;
    finished = false;
    hint.classList.add("is-hide");
    clearVerse();
    fishHit.classList.remove("is-idle");

    var ctx = ensureCtx();
    unlockSpeech();
    if (ctx) playIntro(ctx);
    else strikeVisual();

    var speechMs = estimateSpeechMs();
    setTimeout(function () {
      revealVerse(speechMs);
      if (hasSpeech()) {
        speakSentence(function () {
          setTimeout(endRitual, POST_PAUSE);
        });
        safetyTimer = setTimeout(function () {
          setTimeout(endRitual, POST_PAUSE);
        }, speechMs + 3500);
      } else {
        setTimeout(function () { setTimeout(endRitual, POST_PAUSE); }, Math.max(4200, speechMs * 0.7));
      }
    }, SPEECH_AT);
  }

  fishHit.addEventListener("click", startRitual);

  /* 單頁鎖定：禁止開新分頁，但允許「回抽籤」同分頁回上層 */
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a,area,form");
    if (!a) return;
    if (a === document.getElementById("back") || (a.getAttribute && a.getAttribute("href") === "../")) {
      if (!a.target) return;
    }
    e.preventDefault();
  }, true);
  document.addEventListener("auxclick", function (e) { e.preventDefault(); }, true);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
  document.addEventListener("dragstart", function (e) { e.preventDefault(); }, true);
  document.addEventListener("submit", function (e) { e.preventDefault(); }, true);
  window.open = function () { return null; };

  function encodeWav(buffer) {
    var n = buffer.length, sr = buffer.sampleRate, ch = buffer.numberOfChannels;
    var i, c, s, offset, dataLen = n * ch * 2;
    var out = new ArrayBuffer(44 + dataLen);
    var v = new DataView(out);
    function str(o, t) { for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
    str(0, "RIFF");
    v.setUint32(4, 36 + dataLen, true);
    str(8, "WAVE");
    str(12, "fmt ");
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, ch, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * ch * 2, true);
    v.setUint16(32, ch * 2, true);
    v.setUint16(34, 16, true);
    str(36, "data");
    v.setUint32(40, dataLen, true);
    var channels = [];
    for (c = 0; c < ch; c++) channels.push(buffer.getChannelData(c));
    offset = 44;
    for (i = 0; i < n; i++) {
      for (c = 0; c < ch; c++) {
        s = Math.max(-1, Math.min(1, channels[c][i]));
        v.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }
    }
    return out;
  }

  window.__muyu = {
    start: startRitual,
    showVerse: showVerseNow,
    pickVoice: pickVoice,
    hasSpeech: hasSpeech,
    sentence: SENTENCE,
    params: { rate: RATE, pitch: PITCH },
    renderPreview: function (cb) {
      var OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!OC) { cb(null, "no OfflineAudioContext"); return; }
      var sr = 44100;
      var ctx = new OC(1, Math.ceil(sr * 2.2), sr);
      playQing(ctx, 0.05, 0.34);
      playKnock(ctx, 0.05 + PRE_KNOCK, 1);
      playKnock(ctx, 0.85, 0.95);
      playKnock(ctx, 0.85 + 0.30, 0.62);
      playKnock(ctx, 0.85 + 0.60, 0.34);
      ctx.startRendering().then(function (buf) {
        cb(encodeWav(buf), null, buf);
      }).catch(function (err) { cb(null, String(err)); });
    }
  };
})();
</script>
