  :root {
    --bg: #FFF8F2;
    --red: #FD1417;
    --black: #1A1A1A;
    --ink: #1A1A1A;
    --date: #2C2C2C;
    --gold: #F2C94C;
    --gold-dk: #C48A18;
    --paper: #FFFDF8;
    --serif: "WenKai TC", "Songti TC", "Hiragino Mincho ProN", serif;
    --sans: "PingFang TC", "Hiragino Sans", "Noto Sans CJK TC", "Heiti TC",
            "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--black);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #fit {
    position: fixed;
    inset: 0;
    background: var(--bg);
  }
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 390px;
    height: 844px;
    margin: 0;
    background: var(--bg);
    transform-origin: center center;
    overflow: hidden;
  }
  .screen {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  .screen.is-on {
    opacity: 1;
    pointer-events: auto;
  }

  /* —— coin —— */
  .coin-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin-shadow {
    position: absolute;
    width: 180px;
    height: 26px;
    left: 50%;
    top: 50%;
    margin-left: -90px;
    margin-top: 148px;
    background: radial-gradient(ellipse at center, rgba(138,90,16,.34) 0%, rgba(138,90,16,0) 72%);
    pointer-events: none;
    z-index: 0;
  }
  .coin-hit {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    width: 228px;
    height: 319px;
    cursor: pointer;
    perspective: 1100px;
    -webkit-perspective: 1100px;
    position: relative;
    z-index: 1;
  }
  .coin-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  .rim {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 205.2px;
    height: 278px;
    margin-left: -102.6px;
    margin-top: -139px;
    border-radius: 50%;
    pointer-events: none;
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .gloss {
    position: absolute;
    inset: 12% 18%;
    border-radius: 50%;
    background: linear-gradient(115deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 42%);
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: .55;
  }

  /* —— scroll group, vertically centered, tight gaps —— */
  .scroll-group {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px 0 24px;
  }
  .kakejiku {
    width: 220px;
    flex: 0 0 auto;
    transform-origin: top center;
  }
  .rod {
    height: 11px;
    background: linear-gradient(#3a3a3a, #111 45%, #2c2c2c);
    border-radius: 6px;
    position: relative;
    margin: 0 -10px;
  }
  .knob {
    position: absolute;
    top: -5px;
    width: 20px;
    height: 21px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #F2C94C, #C48A18 55%, #8B5A10);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.25);
  }
  .knob.l { left: -12px; }
  .knob.r { right: -12px; }
  .scroll-paper {
    margin: 0 8px;
    background: var(--paper);
    border-left: 6px solid var(--red);
    border-right: 6px solid var(--red);
    height: 528px;
    display: flex;
    flex-direction: column;
  }
  .heaven {
    flex: 0 0 52px;
  }
  .earth {
    flex: 0 0 30px;
  }
  .cols {
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 22px;
    padding: 0 12px;
    min-height: 0;
  }
  .col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: var(--serif);
    font-weight: 400;
    line-height: 1;
  }
  .col.no {
    color: var(--red);
    font-size: 18px;
    letter-spacing: 0.28em;
    padding-top: 2px;
  }
  .col.txt {
    color: var(--ink);
    font-size: 28px;
    letter-spacing: 0.22em;
  }
  .col.day {
    color: var(--date);
    font-size: 15px;
    letter-spacing: 0.22em;
    padding-top: 2px;
  }
  .logo-wanfu {
    width: 112px;
    height: auto;
    display: block;
    flex: 0 0 auto;
  }
  .again {
    appearance: none;
    -webkit-appearance: none;
    position: static;
    background: var(--black);
    color: var(--gold);
    border: 1.5px solid var(--gold-dk);
    border-radius: 999px;
    padding: 10px 32px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.32em;
    font-family: var(--sans);
    cursor: pointer;
    line-height: 1.2;
    flex: 0 0 auto;
  }
  .again:active {
    background: var(--red);
    color: #fff;
    border-color: var(--black);
  }
  .kakejiku.is-enter {
    animation: unroll .62s cubic-bezier(.22,1,.36,1) both;
  }
  .logo-wanfu.is-enter {
    animation: fadeUp .42s .16s cubic-bezier(.22,1,.36,1) both;
  }
  .again.is-enter {
    animation: fadeUp .42s .24s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes unroll {
    from { opacity: 0; transform: scaleY(.08); }
    to   { opacity: 1; transform: scaleY(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

  function fit() {
    var w = window.innerWidth || 390;
    var h = window.innerHeight || 844;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    var s = Math.min(w / 390, h / 844);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

  function applyAngle(deg) {
    var t = "rotateY(" + deg + "deg)";
    coin3d.style.transform = t;
    coin3d.style.webkitTransform = t;
    var c = Math.cos(deg * Math.PI / 180);
    shadow.style.transform = "scaleX(" + (0.30 + 0.70 * Math.abs(c)).toFixed(3) + ")";
    shadow.style.opacity = (0.16 + 0.24 * Math.abs(c)).toFixed(3);
    if (glossEl) {
      var vis = Math.max(0, c);
      glossEl.style.opacity = (0.15 + 0.45 * vis).toFixed(3);
      glossEl.style.transform = "translateX(" + ((1 - vis) * 18 - 6).toFixed(1) + "px)";
    }
  }
  applyAngle(0);

  function hantNum(n) {
    var d = "零一二三四五六七八九";
    if (n === 100) return "一百";
    if (n <= 10) return "一二三四五六七八九十".charAt(n - 1);
    if (n < 20) return "十" + d.charAt(n - 10);
    var tens = Math.floor(n / 10), ones = n % 10;
    return d.charAt(tens) + "十" + (ones ? d.charAt(ones) : "");
  }

  function taipeiDate() {
    var parts = new Intl.DateTimeFormat("zh-TW", {
      timeZone: "Asia/Taipei",
      year: "numeric", month: "numeric", day: "numeric"
    }).formatToParts(new Date());
    function get(t) {
      var p = parts.find(function (x) { return x.type === t; });
      return p ? Number(p.value) : 0;
    }
    var y = String(get("year"));
    var map = { "0": "〇", "1": "一", "2": "二", "3": "三", "4": "四",
                 "5": "五", "6": "六", "7": "七", "8": "八", "9": "九" };
    var year = y.split("").map(function (c) { return map[c] || c; }).join("");
    function md(n) {
      if (n <= 10) return "一二三四五六七八九十".charAt(n - 1);
      if (n < 20) return "十" + "一二三四五六七八九".charAt(n - 11);
      return "二十" + (n > 20 ? "一二三四五六七八九".charAt(n - 21) : "");
    }
    return year + "年" + md(get("month")) + "月" + md(get("day")) + "日";
  }

  function drawFortune(idx) {
    if (idx == null) idx = Math.floor(Math.random() * FORTUNES.length);
    document.getElementById("fNo").textContent = "第" + hantNum(idx + 1) + "籤";
    document.getElementById("fTxt").textContent = FORTUNES[idx];
    document.getElementById("fDay").textContent = taipeiDate();
    return idx;
  }

  function retrigger(el) {
    el.classList.remove("is-enter");
    void el.offsetWidth;
    el.classList.add("is-enter");
  }

  function showScroll() {
    drawFortune();
    screenCoin.classList.remove("is-on");
    screenScroll.classList.add("is-on");
    retrigger(kakejiku);
    retrigger(logoWanfu);
    retrigger(again);
  }

  /* 蓄力 → 狂轉 → 減速 → 末圈帶晃動回正 */
  function angleAt(p) {
    var tWind = 0.10;
    if (p <= tWind) {
      var u = p / tWind;
      return -WIND * Math.sin(u * Math.PI / 2);
    }
    var u = (p - tWind) / (1 - tWind);
    var uAcc = 0.11;
    var e;
    if (u < uAcc) {
      var a = u / uAcc;
      e = 0.035 * (a * a);
    } else {
      var b = (u - uAcc) / (1 - uAcc);
      e = 0.035 + 0.965 * (1 - Math.pow(1 - b, 3.7));
    }
    var ang = -WIND + e * (TARGET + WIND);
    if (u > 0.78) {
      var w = (u - 0.78) / 0.22;
      var decay = Math.exp(-w * 4.4) * (1 - w);
      ang += Math.sin(w * Math.PI * 6.2) * 18 * decay;
    }
    return ang;
  }

  function playFlip(done) {
    if (raf) cancelAnimationFrame(raf);
    var t0 = performance.now();
    coin3d.style.willChange = "transform";
    function tick(now) {
      var p = Math.min(1, (now - t0) / DURATION);
      var deg = (p >= 1) ? TARGET : angleAt(p);
      applyAngle(deg);
      if (p < 1) {
        raf = requestAnimationFrame(tick);
      } else {
        applyAngle(TARGET);
        coin3d.style.willChange = "auto";
        raf = 0;
        if (done) done();
      }
    }
    raf = requestAnimationFrame(tick);
  }

  coinHit.addEventListener("click", function () {
    if (busy) return;
    busy = true;
    playFlip(function () {
      setTimeout(function () {
        showScroll();
        busy = false;
      }, 380);
    });
  });

  again.addEventListener("click", function () {
    if (busy) return;
    busy = true;
    screenScroll.classList.remove("is-on");
    kakejiku.classList.remove("is-enter");
    logoWanfu.classList.remove("is-enter");
    again.classList.remove("is-enter");
    setTimeout(function () {
      applyAngle(0);
      screenCoin.classList.add("is-on");
      setTimeout(function () { busy = false; }, 280);
    }, 280);
  });

  window.__wanfu = {
    setAngle: applyAngle,
    showFortune: function (i) {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      drawFortune(i);
      screenCoin.classList.remove("is-on");
      screenScroll.classList.add("is-on");
      kakejiku.classList.add("is-enter");
      logoWanfu.classList.add("is-enter");
      again.classList.add("is-enter");
    },
    resetCoin: function () {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      screenScroll.classList.remove("is-on");
      screenCoin.classList.add("is-on");
      applyAngle(0);
    },
    longestIndex: 99,
    target: TARGET,
    duration: DURATION
  };
})();
