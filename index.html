  :root {
    --bg: #FFF8F2;
    --red: #FD1417;
    --black: #1A1A1A;
    --ink: #1A1A1A;
    --date: #2C2C2C;
    --gold: #F2C94C;
    --gold-dk: #C48A18;
    --paper: #FFFDF8;
    --serif: "WenKai TC", "Songti TC", "Hiragino Mincho ProN", serif;
    --sans: "PingFang TC", "Hiragino Sans", "Noto Sans CJK TC", "Heiti TC",
            "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--black);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #fit {
    position: fixed;
    inset: 0;
    background: var(--bg);
  }
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 390px;
    height: 844px;
    margin: 0;
    background: var(--bg);
    transform-origin: center center;
    overflow: hidden;
  }
  .screen {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  .screen.is-on {
    opacity: 1;
    pointer-events: auto;
  }

  /* —— coin —— */
  .coin-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin-shadow {
    position: absolute;
    width: 180px;
    height: 26px;
    left: 50%;
    top: 50%;
    margin-left: -90px;
    margin-top: 148px;
    background: radial-gradient(ellipse at center, rgba(138,90,16,.34) 0%, rgba(138,90,16,0) 72%);
    pointer-events: none;
    z-index: 0;
  }
  .coin-hit {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    width: 228px;
    height: 319px;
    cursor: pointer;
    perspective: 1100px;
    -webkit-perspective: 1100px;
    position: relative;
    z-index: 1;
  }
  .coin-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  .rim {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 205.2px;
    height: 278px;
    margin-left: -102.6px;
    margin-top: -139px;
    border-radius: 50%;
    pointer-events: none;
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .gloss {
    position: absolute;
    inset: 12% 18%;
    border-radius: 50%;
    background: linear-gradient(115deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 42%);
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: .55;
  }

  /* —— scroll group, vertically centered, tight gaps —— */
  .scroll-group {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px 0 24px;
  }
  .kakejiku {
    width: 220px;
    flex: 0 0 auto;
    transform-origin: top center;
  }
  .rod {
    height: 11px;
    background: linear-gradient(#3a3a3a, #111 45%, #2c2c2c);
    border-radius: 6px;
    position: relative;
    margin: 0 -10px;
  }
  .knob {
    position: absolute;
    top: -5px;
    width: 20px;
    height: 21px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #F2C94C, #C48A18 55%, #8B5A10);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.25);
  }
  .knob.l { left: -12px; }
  .knob.r { right: -12px; }
  .scroll-paper {
    margin: 0 8px;
    background: var(--paper);
    border-left: 6px solid var(--red);
    border-right: 6px solid var(--red);
    height: 528px;
    display: flex;
    flex-direction: column;
  }
  .heaven {
    flex: 0 0 68px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
  }
  .inu-hariko {
    display: block;
    height: 38px;
    width: auto;
    overflow: visible;
    flex: 0 0 auto;
  }
  .earth {
    flex: 0 0 30px;
  }
  .cols {
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 22px;
    padding: 0 12px;
    min-height: 0;
  }
  .col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: var(--serif);
    font-weight: 400;
    line-height: 1;
  }
  .col.no {
    color: var(--red);
    font-size: 18px;
    letter-spacing: 0.28em;
    padding-top: 2px;
  }
  .col.txt {
    color: var(--ink);
    font-size: 28px;
    letter-spacing: 0.22em;
  }
  .col.day {
    color: var(--date);
    font-size: 15px;
    letter-spacing: 0.22em;
    padding-top: 2px;
  }
  .logo-wanfu {
    width: 84px;
    height: auto;
    display: block;
    flex: 0 0 auto;
  }
  .again {
    appearance: none;
    -webkit-appearance: none;
    position: static;
    background: var(--black);
    color: var(--gold);
    border: 1.5px solid var(--gold-dk);
    border-radius: 999px;
    padding: 10px 32px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.32em;
    font-family: var(--sans);
    cursor: pointer;
    line-height: 1.2;
    flex: 0 0 auto;
  }
  .again:active {
    background: var(--red);
    color: #fff;
    border-color: var(--black);
  }
  .kakejiku.is-enter {
    animation: unroll .62s cubic-bezier(.22,1,.36,1) both;
  }
  .logo-wanfu.is-enter {
    animation: fadeUp .42s .16s cubic-bezier(.22,1,.36,1) both;
  }
  .again.is-enter {
    animation: fadeUp .42s .24s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes unroll {
    from { opacity: 0; transform: scaleY(.08); }
    to   { opacity: 1; transform: scaleY(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* —— actions under the scroll —— */
  .action-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex: 0 0 auto;
  }
  .action-row.is-enter {
    animation: fadeUp .42s .24s cubic-bezier(.22,1,.36,1) both;
  }

  /* —— small muyu entry on the coin screen —— */
  .muyu-entry {
    appearance: none;
    -webkit-appearance: none;
    position: absolute;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%);
    z-index: 2;
    background: var(--black);
    color: var(--gold);
    border: 1.5px solid var(--gold-dk);
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.32em;
    font-family: var(--sans);
    cursor: pointer;
    line-height: 1.2;
  }
  .muyu-entry:active {
    background: var(--red);
    color: #fff;
    border-color: var(--black);
  }

  /* —— muyu overlay (same page, fades in over coin/scroll) —— */
  #screen-muyu {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
  }
  #screen-muyu.is-on {
    opacity: 1;
    pointer-events: auto;
  }
  #screen-muyu .muyu-audio {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    opacity: 0;
    pointer-events: none;
  }
  #screen-muyu .vol-hint {
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #8A5510;
    opacity: 0.88;
    text-align: center;
    margin: 0 0 2px;
  }
  #screen-muyu .layout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px 24px;
  }
  #screen-muyu .inu {
    display: block;
    height: 78px;
    width: auto;
    flex: 0 0 auto;
  }
  #screen-muyu .fish-hit {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    margin: 6px 0 0;
    width: 300px;
    height: 250px;
    cursor: pointer;
    position: relative;
    flex: 0 0 auto;
  }
  #screen-muyu .fish-hit:focus { outline: none; }
  #screen-muyu .fish-hit:focus-visible {
    outline: 2px solid var(--gold-dk);
    outline-offset: 4px;
    border-radius: 16px;
  }
  #screen-muyu .fish-hit svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  #screen-muyu .halo {
    position: absolute;
    left: 50%;
    top: 62%;
    width: 240px;
    height: 90px;
    margin-left: -120px;
    margin-top: -18px;
    background: radial-gradient(ellipse at center, rgba(242,201,76,.26) 0%, rgba(242,201,76,0) 72%);
    pointer-events: none;
    z-index: 0;
  }
  #screen-muyu .fish-svg { position: relative; z-index: 1; }
  #screen-muyu .mallet {
    transform-box: fill-box;
    transform-origin: 50% 92%;
    transform: rotate(-12deg);
  }
  #screen-muyu .fish-body {
    transform-box: fill-box;
    transform-origin: 50% 80%;
  }
  #screen-muyu .fish-hit.is-striking .fish-body {
    animation: muyuPress .22s ease;
  }
  #screen-muyu .fish-hit.is-striking .mallet {
    animation: muyuTap .22s ease;
  }
  @keyframes muyuPress {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(5px) scale(0.97, 0.95); }
  }
  @keyframes muyuTap {
    0%, 100% { transform: rotate(-12deg); }
    40% { transform: rotate(16deg); }
  }
  #screen-muyu .slot {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    margin-top: 2px;
  }
  #screen-muyu .hint {
    font-family: var(--serif);
    font-size: 16px;
    letter-spacing: 0.42em;
    color: #6B3E0A;
    text-indent: 0.42em;
    transition: opacity .4s ease;
    text-align: center;
    pointer-events: none;
    height: 28px;
    line-height: 28px;
    flex: 0 0 28px;
  }
  #screen-muyu .hint.is-hide { opacity: 0; }
  #screen-muyu .verse {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 36px;
    min-height: 176px;
    padding-top: 4px;
  }
  #screen-muyu .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.26;
    color: var(--ink);
    writing-mode: horizontal-tb;
    text-orientation: mixed;
    letter-spacing: 0;
  }
  #screen-muyu .col .ch {
    display: block;
    height: 1.26em;
    opacity: 0;
  }
  #screen-muyu .col .ch.is-on {
    animation: muyuCharIn .55s ease both;
  }
  #screen-muyu .col .ch.is-shown {
    opacity: 1;
  }
  @keyframes muyuCharIn {
    from { opacity: 0; filter: blur(3px); }
    to   { opacity: 1; filter: blur(0); }
  }
  #screen-muyu .logo-wanfu {
    width: 84px;
    height: auto;
    display: block;
    flex: 0 0 auto;
    margin-top: 8px;
  }
  #screen-muyu .muyu-back {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    margin-top: 14px;
    background: transparent;
    border: 0;
    border-bottom: 1.5px solid var(--gold-dk);
    border-radius: 0;
    padding: 0 0 2px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--black);
    cursor: pointer;
    line-height: 1.2;
  }
  #screen-muyu .muyu-back:active { color: var(--red); }
/* 單頁鎖定：不讓長按圖片或任何連結開新分頁 */
img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none;}
body{-webkit-touch-callout:none;}
</style>
</head>

    var uAcc = 0.11;

      e = 0.035 * (a * a);
    } else {
      var b = (u - uAcc) / (1 - uAcc);
      e = 0.035 + 0.965 * (1 - Math.pow(1 - b, 3.7));
    }
    var ang = -WIND + e * (TARGET + WIND);
    if (u > 0.78) {

      ang += Math.sin(w * Math.PI * 6.2) * 18 * decay;
    }
    return ang;
  }

  }

      osc.frequency.setValueAtTime(p.f, when);
      g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(p.g * gain, when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + p.d);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(when);
      osc.stop(when + p.d + 0.02);
    }
  }
  function muyuEnsureCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!muyuAudioCtx) muyuAudioCtx = new AC();
    if (muyuAudioCtx.state === "suspended") {
      try { muyuAudioCtx.resume(); } catch (e) {}
    }
    return muyuAudioCtx;
  }

  var muyuAudioQing = document.getElementById("muyuAudioQing");
  var muyuAudioKnock = document.getElementById("muyuAudioKnock");
  var muyuUseMedia = !!(muyuAudioQing && muyuAudioQing.play && muyuAudioKnock && muyuAudioKnock.play);

  function muyuPlayTag(el, vol) {
    if (!el || !el.play) return Promise.reject(new Error("no audio"));
    try { el.pause(); } catch (e) {}
    try { el.currentTime = 0; } catch (e2) {}
    try { el.volume = (vol == null) ? 1 : Math.max(0, Math.min(1, vol)); } catch (e3) {}
    try {
      var p = el.play();
      return (p && p.then) ? p : Promise.resolve();
    } catch (err) {
      return Promise.reject(err);
    }
  }
  function muyuUnlockTag(el) {
    if (!el || !el.play) return Promise.resolve();
    var oldV = 1;
    try { oldV = el.volume; } catch (e) {}
    el.muted = true;
    try { el.volume = 0; } catch (e2) {}
    function restore() {
      try { el.pause(); } catch (e) {}
      try { el.currentTime = 0; } catch (e2) {}
      el.muted = false;
      try { el.volume = oldV; } catch (e3) {}
    }
    try {
      var p = el.play();
      if (p && p.then) return p.then(restore, restore);
    } catch (err) {}
    restore();
    return Promise.resolve();
  }
  function muyuHitKnock(gain) {
    gain = (gain == null) ? 1 : gain;
    if (muyuUseMedia) {
      var p = muyuPlayTag(muyuAudioKnock, gain);
      if (p && p.catch) {
        p.catch(function () {
          var ctx = muyuEnsureCtx();
          if (ctx) muyuPlayKnock(ctx, ctx.currentTime + 0.02, gain);
        });
      }
      return;
    }
    var ctx = muyuEnsureCtx();
    if (ctx) muyuPlayKnock(ctx, ctx.currentTime + 0.02, gain);
  }
  function muyuHitQing(gain) {
    gain = (gain == null) ? 0.34 : gain;
    if (muyuUseMedia) {
      var p = muyuPlayTag(muyuAudioQing, 1);
      if (p && p.catch) {
        p.catch(function () {
          var ctx = muyuEnsureCtx();
          if (ctx) muyuPlayQing(ctx, ctx.currentTime + 0.02, gain);
        });
      }
      return;
    }
    var ctx = muyuEnsureCtx();
    if (ctx) muyuPlayQing(ctx, ctx.currentTime + 0.02, gain);
  }
  function muyuStrikeVisual() {
    if (!muyuOverlayOn) return;
    fishHit.classList.remove("is-idle");
    fishHit.classList.remove("is-striking");
    void fishHit.offsetWidth;
    fishHit.classList.add("is-striking");
  }
  function muyuClearVerse() {
    muyuColR.innerHTML = "";
    muyuColL.innerHTML = "";
  }
  function muyuFillCol(el, text) {
    el.innerHTML = "";
    var i, s;
    for (i = 0; i < text.length; i++) {
      s = document.createElement("span");
      s.className = "ch";
      s.textContent = text.charAt(i);
      el.appendChild(s);
    }
  }
  function muyuRevealVerse(totalMs) {
    muyuFillCol(muyuColR, MUYU_COL_R);
    muyuFillCol(muyuColL, MUYU_COL_L);
    var nodes = muyuColR.querySelectorAll(".ch");
    var nodesL = muyuColL.querySelectorAll(".ch");
    var all = [];
    var i;
    for (i = 0; i < nodes.length; i++) all.push(nodes[i]);
    for (i = 0; i < nodesL.length; i++) all.push(nodesL[i]);
    var step = all.length ? Math.max(80, (totalMs * 0.82) / all.length) : 200;
    for (i = 0; i < all.length; i++) {
      (function (node, delay) {
        muyuLater(function () { node.classList.add("is-on"); }, delay);
      })(all[i], Math.round(i * step));
    }
  }
  function muyuShowVerseNow() {
    muyuFillCol(muyuColR, MUYU_COL_R);
    muyuFillCol(muyuColL, MUYU_COL_L);
    var nodes = screenMuyu.querySelectorAll(".col .ch");
    var i;
    for (i = 0; i < nodes.length; i++) nodes[i].classList.add("is-shown");
  }
  function muyuUnlockSpeech() {
    if (!muyuHasSpeech()) return;
    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      u.rate = 1;
      u.pitch = 1;
      u.lang = "zh-TW";
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function muyuEstimateSpeechMs() {
    return Math.ceil(MUYU_SENTENCE.length * 420 / MUYU_RATE) + 400;
  }
  function muyuSpeakSentence(onEnd) {
    if (!muyuHasSpeech()) { onEnd(); return; }
    try { window.speechSynthesis.cancel(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(MUYU_SENTENCE);
    u.rate = MUYU_RATE;
    u.pitch = MUYU_PITCH;
    u.volume = 1;
    var v = muyuPickVoice();
    if (v) { u.voice = v; u.lang = v.lang || "zh-TW"; }
    else { u.lang = "zh-TW"; }
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      if (!muyuOverlayOn) return;
      onEnd();
    }
    u.onend = finish;
    u.onerror = finish;
    try { window.speechSynthesis.speak(u); }
    catch (err) { finish(); return; }
    muyuLater(function () {
      if (done) return;
      try {
        if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
          var v2 = muyuPickVoice();
          if (v2) { u.voice = v2; u.lang = v2.lang || u.lang; }
          window.speechSynthesis.speak(u);
        }
      } catch (e2) {}
    }, 180);
  }
  function muyuPlayIntro() {
    if (muyuUseMedia) muyuUnlockTag(muyuAudioKnock);
    muyuHitQing(0.34);
    muyuLater(function () {
      muyuHitKnock(1);
      muyuStrikeVisual();
    }, Math.round(MUYU_PRE_KNOCK * 1000));
  }
  function muyuPlayOutro(then) {
    var i, delay;
    for (i = 0; i < MUYU_POST_GAINS.length; i++) {
      delay = i * MUYU_POST_GAP;
      (function (d, g) {
        muyuLater(function () {
          muyuHitKnock(g);
          muyuStrikeVisual();
        }, d);
      })(delay, MUYU_POST_GAINS[i]);
    }
    muyuLater(then, MUYU_POST_GAINS.length * MUYU_POST_GAP + 420);
  }
  function muyuResetVisual() {
    muyuHint.textContent = "輕敲木魚";
    muyuHint.classList.remove("is-hide");
    muyuClearVerse();
    fishHit.classList.remove("is-striking");
    fishHit.classList.add("is-idle");
  }
  function muyuStop(opts) {
    opts = opts || {};
    muyuFinished = true;
    muyuBusy = false;
    muyuClearTimers();
    if (muyuHasSpeech()) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    if (!opts.keepVerse) muyuResetVisual();
  }
  function muyuEndRitual() {
    if (muyuFinished || !muyuOverlayOn) return;
    muyuFinished = true;
    if (muyuSafety) { clearTimeout(muyuSafety); muyuSafety = 0; }
    function wrap() {
      if (!muyuOverlayOn) return;
      muyuHint.textContent = "輕敲木魚";
      muyuHint.classList.remove("is-hide");
      fishHit.classList.remove("is-striking");
      fishHit.classList.add("is-idle");
      muyuBusy = false;
    }
    muyuPlayOutro(wrap);
  }
  function muyuStartRitual() {
    if (muyuBusy || !muyuOverlayOn) return;
    muyuBusy = true;
    muyuFinished = false;
    muyuClearTimers();
    muyuHint.classList.add("is-hide");
    muyuClearVerse();
    fishHit.classList.remove("is-idle");
    var speechMs = muyuEstimateSpeechMs();
    /* same-click: unlock speech + start the utterance; play first sound now */
    muyuUnlockSpeech();
    muyuPlayIntro();
    muyuRevealVerse(speechMs);
    if (muyuHasSpeech()) {
      muyuSpeakSentence(function () {
        muyuLater(muyuEndRitual, MUYU_POST_PAUSE);
      });
      muyuSafety = setTimeout(function () {
        if (!muyuOverlayOn) return;
        muyuLater(muyuEndRitual, MUYU_POST_PAUSE);
      }, speechMs + 3500);
      muyuTimers.push(muyuSafety);
    } else {
      muyuLater(function () { muyuLater(muyuEndRitual, MUYU_POST_PAUSE); }, Math.max(4200, speechMs * 0.7));
    }
  }
  function openMuyu() {
    muyuShareImgs();
    muyuStop();
    muyuOverlayOn = true;
    screenMuyu.classList.add("is-on");
    screenMuyu.setAttribute("aria-hidden", "false");
  }
  function closeMuyu() {
    muyuOverlayOn = false;
    muyuStop();
    screenMuyu.classList.remove("is-on");
    screenMuyu.setAttribute("aria-hidden", "true");
  }

  fishHit.addEventListener("click", function () { muyuStartRitual(); });
  muyuOpenBtn.addEventListener("click", function () { openMuyu(); });
  muyuEntry.addEventListener("click", function (e) {
    e.stopPropagation();
    if (busy) return;
    openMuyu();
  });
  muyuBack.addEventListener("click", function () { closeMuyu(); });

  window.__muyu = {
    open: openMuyu,
    close: closeMuyu,
    start: muyuStartRitual,
    showVerse: muyuShowVerseNow,
    pickVoice: muyuPickVoice,
    hasSpeech: muyuHasSpeech,
    sentence: MUYU_SENTENCE,
    params: { rate: MUYU_RATE, pitch: MUYU_PITCH },
    audioQing: muyuAudioQing,
    audioKnock: muyuAudioKnock
  };

  window.__wanfu = {
    setAngle: applyAngle,
    showFortune: function (i) {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      drawFortune(i);
      screenCoin.classList.remove("is-on");
      screenScroll.classList.add("is-on");
      kakejiku.classList.add("is-enter");
      logoWanfu.classList.add("is-enter");
      actionRow.classList.add("is-enter");
    },
    resetCoin: function () {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      screenScroll.classList.remove("is-on");
      screenCoin.classList.add("is-on");
      applyAngle(0);
    },
    longestIndex: 99,
    target: TARGET,
    duration: DURATION,
    openMuyu: function () { window.__muyu && window.__muyu.open(); },
    closeMuyu: function () { window.__muyu && window.__muyu.close(); }
  };
})();
</script>
<script>
/* 單頁鎖定：所有點擊、長按、拖曳都留在本頁 */
(function(){
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a,area,form");
    if(a){e.preventDefault();}
  },true);
  document.addEventListener("auxclick",function(e){e.preventDefault();},true);
  document.addEventListener("contextmenu",function(e){e.preventDefault();},true);
  document.addEventListener("dragstart",function(e){e.preventDefault();},true);
  document.addEventListener("submit",function(e){e.preventDefault();},true);
  window.open=function(){return null;};
})();
</script>
